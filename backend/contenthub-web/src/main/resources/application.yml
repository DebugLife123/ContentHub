server:
  # 计划表 19 约定所有业务接口以 /api 开头。
  # 用 context-path 统一加前缀，这样 Security 的路径匹配写的是
  # context 内的 /contents、/admin 等，而外部访问是 /api/contents、/api/admin。
  # 注意：API 文档地址因此变为 http://127.0.0.1:8084/api/doc.html
  servlet:
    context-path: /api
  tomcat:
    # 请求体超过 multipart 限制时，Tomcat 默认会直接断开连接，调用方只看到网络错误
    # （前端表现成「点了没反应」）。设成 -1 让它把剩余请求体读完，
    # 这样 GlobalExceptionHandler 里的 MaxUploadSizeExceededException 分支才能返回 413。
    max-swallow-size: -1

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      # 单文件上限，与 contenthub.upload.max-size-bytes 保持一致
      max-file-size: 50MB
      # 留出富余：一次请求可能同时带多个表单字段
      max-request-size: 60MB

# 文件上传（见 UploadProperties）
contenthub:
  upload:
    dir: ./uploads
    # 必须带 context-path，因为 Markdown 里的地址是浏览器直接请求的，不走 axios 的 baseURL
    url-prefix: /api/files
    max-size-bytes: 52428800

jwt:
  # 签发人
  issuer: contenthub
  # 签名密钥。刻意<b>不给默认值</b>：以前这里硬编码了一串密钥并提交进了公开仓库，
  # 任何拿到仓库的人都能用它伪造任意用户（含 ADMIN）的 token。
  # 现在必须在环境变量 JWT_SECRET 里提供（Base64 编码的 64 字节，HS512 要求）。
  #   本地开发：application-dev.yml 里有一个仅用于开发的兜底值
  #   容器部署：由 docker-compose.yml 注入，缺失时 compose 直接报错
  secret: ${JWT_SECRET}
  # token 过期时间（单位：分钟） 24*60
  tokenExpireTime: 1440
  # token 请求头中的 key 值
  tokenHeaderKey: Authorization
  # token 请求头中的 value 值前缀
  tokenPrefix: Bearer