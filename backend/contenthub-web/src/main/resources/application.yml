server:
  # 计划表 19 约定所有业务接口以 /api 开头。
  # 用 context-path 统一加前缀，这样 Security 的路径匹配写的是
  # context 内的 /contents、/admin 等，而外部访问是 /api/contents、/api/admin。
  # 注意：API 文档地址因此变为 http://127.0.0.1:8084/api/doc.html
  servlet:
    context-path: /api

spring:
  profiles:
    active: dev

jwt:
  # 签发人
  issuer: contenthub
  # 秘钥
  secret: uJDZw3DfufX2eA/1zgXnlO1mkPTRxuljP83kI3gaYpUgdqoSg4Ej/TvMsth6X/4avyAF8iifrdJitOb6mNtlSg==
  # token 过期时间（单位：分钟） 24*60
  tokenExpireTime: 1440
  # token 请求头中的 key 值
  tokenHeaderKey: Authorization
  # token 请求头中的 value 值前缀
  tokenPrefix: Bearer