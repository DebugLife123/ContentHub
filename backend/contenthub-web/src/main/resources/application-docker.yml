server:
  port: 8084

spring:
  datasource:
    # 容器内直接用官方驱动，不经 p6spy：
    # p6spy 只是本地开发的 SQL 打印工具，没必要带进运行镜像。
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 主机名用 compose 的服务名 mysql，不是 127.0.0.1 —— 容器里的 localhost 是容器自己
    url: jdbc:mysql://mysql:3306/contenthub?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: ContentHub-HikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  # Redis 同样走服务名
  data:
    redis:
      host: redis
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 3000ms

# 容器环境关闭 API 文档，减少对外暴露面
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
