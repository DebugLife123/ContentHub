# ============================================================
# ContentHub
#
# 本地开发（默认，不带 profile）：
#     docker compose up -d
#   只启动 MySQL 与 Redis 两个基础设施容器。
#   后端与前端在宿主机上跑（见 scripts/dev-up.ps1）：
#     - 后端在 IDE / java -jar 里跑，改一次 Java 就能立刻重启
#     - 前端 Vite dev server 需要宿主机 inotify 才能 HMR
#
# 完整部署（带 full profile）：
#     docker compose --profile full up -d --build
#   额外启动 backend 与 frontend（Nginx + 构建产物）。
#   用 profiles 而不是两个 compose 文件，是为了让两套环境共用
#   同一份 MySQL/Redis 定义，端口与数据卷不会漂移。
#
# 端口：springboot-mall 占用 3307、educheck 占用 6379、
#       mbti 占用 8080/5173、其他本机服务占用 8081/8090，
#       这里用 3308 / 6380 / 8085 避开。
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: contenthub-mysql
    restart: unless-stopped
    environment:
      # 本地开发默认 123456；生产通过 .env 注入（服务器上的 override 文件也读同一个变量）
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}"
      MYSQL_DATABASE: contenthub
      TZ: Asia/Shanghai
    ports:
      - "3308:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - contenthub-mysql-data:/var/lib/mysql
      # 首次初始化数据卷时自动执行，建表 + 写入演示数据
      - ./docs/database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    healthcheck:
      # 用容器内的环境变量而不是写死密码，改了 .env 不会让健康检查失真
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: contenthub-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - contenthub-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------------------------------------------------------- 部署用（--profile full）
  backend:
    profiles: ["full"]
    build:
      context: ./backend
    image: contenthub-backend:latest
    container_name: contenthub-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # application-docker.yml：数据库与 Redis 走 compose 服务名
      SPRING_PROFILES_ACTIVE: docker
      TZ: Asia/Shanghai
      # 数据库密码与 MySQL 容器保持同一个来源
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}"
      # 签名密钥必须显式提供：application.yml 里是 ${JWT_SECRET}，容器 profile 没有兜底值。
      # 缺失时 compose 直接报错退出，避免线上悄悄用一个公开的默认密钥。
      JWT_SECRET: "${JWT_SECRET:?请在 .env 中设置 JWT_SECRET（Base64 编码的 64 字节）}"
    # 刻意不发布端口：后端只允许经 Nginx 访问，
    # 避免绕过反向代理直接打 8084
    expose:
      - "8084"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8084/api/contents/page"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
    image: contenthub-frontend:latest
    container_name: contenthub-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
    ports:
      # 对外只暴露这一个端口：Nginx 既发静态文件，也反代 /api
      - "8085:80"

volumes:
  contenthub-mysql-data:
  contenthub-redis-data:
