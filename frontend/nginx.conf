server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 压缩：前端打包后单个 JS 接近 1MB，gzip 后能降到 1/3 左右
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API 反向代理到后端容器。
    # ^~ 表示前缀匹配后不再检查下面的正则 location，
    # 否则 /api/xxx.js 这类请求会被静态资源规则抢走。
    location ^~ /api/ {
        proxy_pass http://backend:8084/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # 带内容哈希的静态资源可以长缓存
    location ~* \.(js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 前端用的是 hash 路由，正常只需要返回 index.html；
    # try_files 兜住直接访问子路径的情况
    location / {
        try_files $uri $uri/ /index.html;
    }
}
